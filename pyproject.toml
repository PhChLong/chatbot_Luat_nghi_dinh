[project]
name = "chatbot-luat-nghi-dinh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PhChLong", email = "phamchaulong10082006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.12",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
chatbot = "chatbot_luat_nghi_dinh:main"
crawl = "crawl_luat_nghi_dinh:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["EXE005"]